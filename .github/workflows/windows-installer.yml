name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          ELECTRON_BUILD: "1"
      - name: Package installer
        shell: bash
        run: |
          mkdir -p pkg
          cp -r electron dist pkg/
          cp electron/package.json pkg/package.json
          cd pkg
          npm install --no-save electron@33 electron-builder@25
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: GroceryPOS-Setup
          path: pkg/dist/*.exe
