name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install application dependencies
        run: bun install --frozen-lockfile
      - name: Build Windows application interface
        run: bun run build
        env:
          ELECTRON_BUILD: "1"
      - name: Verify application interface
        shell: bash
        run: |
          echo "Build output:"; find dist .output -maxdepth 4 -type f 2>/dev/null | grep -v '/assets/' || true
          if [ ! -f dist/client/_shell.html ]; then
            SHELL=$(find dist .output -type f \( -name '_shell.html' -o -path '*_shell/index.html' -o -name 'index.html' \) 2>/dev/null | grep -v node_modules | head -1)
            if [ -z "$SHELL" ]; then echo "ERROR: no HTML shell produced"; exit 1; fi
            SRC=$(dirname "$SHELL"); case "$SHELL" in *_shell/index.html) SRC=$(dirname "$SRC");; esac
            mkdir -p dist/client
            [ "$SRC" != "dist/client" ] && cp -r "$SRC"/. dist/client/
            cp "$SHELL" dist/client/_shell.html
          fi
          test -f dist/client/_shell.html
      - name: Stage Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item electron -Destination pkg/electron -Recurse -Force
          Copy-Item dist -Destination pkg/dist -Recurse -Force
          Copy-Item electron/package.json -Destination pkg/package.json -Force
      - name: Package installer
        shell: bash
        run: |
          cd pkg
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
          test -f release/win-unpacked/resources/app/_shell.html
      - name: Publish update
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v${VERSION}" \
            pkg/release/*.exe \
            pkg/release/*.blockmap \
            pkg/release/latest.yml \
            --title "Grocery POS v${VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: GroceryPOS-Setup
          path: pkg/release/*.exe
