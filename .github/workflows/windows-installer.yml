name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          ELECTRON_BUILD: "1"
      - name: Package installer
        shell: bash
        run: |
          mkdir -p pkg
          cp -r electron dist pkg/
          cp electron/package.json pkg/package.json
          # Fail loudly if the app UI files are missing — never ship a broken installer
          test -f pkg/dist/client/_shell.html
          cd pkg
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm install
          npx electron-builder --win --publish always \
            -c.publish.provider=github \
            -c.publish.owner="${{ github.repository_owner }}" \
            -c.publish.repo="${{ github.event.repository.name }}" \
            -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: GroceryPOS-Setup
          path: pkg/release/*.exe
